[package]
name = "nyanpasu-jobs"
version = "0.1.5"
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Actor-owned jobs with durable runs, scheduling, and scoped tracing journals"

[features]
default = ["redb-store"]
redb-store = ["dep:redb"]
specta = ["dep:specta"]

[dependencies]
jiff = { version = "1", features = ["serde"] }
croner = { version = "=5.0.1", default-features = false, features = ["std", "jiff"] }
futures-util.workspace = true
ractor = "0.16.5"
redb = { version = "5.0.0", optional = true }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

specta = { version = "2.0.0-rc.28", features = ["derive"], optional = true }

[dev-dependencies]
specta-serde = "0.0.15"
specta-typescript = "0.0.15"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "manual"
required-features = ["redb-store"]
