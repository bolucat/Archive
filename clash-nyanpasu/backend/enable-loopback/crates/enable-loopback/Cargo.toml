[package]
name = "enable-loopback"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "enableLoopback"
path = "src/main.rs"
# Keep the executable-only manifest out of the test harness; unit tests live in the library.
test = false

[dependencies]
rust-i18n = "4"
nyanpasu-windows-dependencies = { git = "https://github.com/libnyanpasu/nyanpasu-windows-dependencies.git", rev = "df7fa8f4adbfe60f0d574560a228ccae3dd7b548" }
snafu = "0.8"
sys-locale = "0.3"
windows-reactor = { path = "../../vendor/windows-rs/crates/libs/reactor" }
windows = { path = "../../vendor/windows-rs/crates/libs/windows", features = ["libloaderapi", "debugapi", "winuser", "shellscalingapi", "shellapi", "commctrl", "winerror", "winnt", "netfw", "sddl", "secext", "securitybaseapi", "shlwapi", "winbase", "heapapi", "winreg", "errhandlingapi", "processenv", "synchapi", "memoryapi", "handleapi", "processthreadsapi", "datetimeapi", "sysinfoapi"] }

[build-dependencies]
resvg = { version = "0.45", default-features = false }
ico = "0.5"
embed-resource = "3"

[dev-dependencies]
windows-reactor = { path = "../../vendor/windows-rs/crates/libs/reactor", features = ["test"] }
serde_json = "1"
rayon = "1.11"

[[bench]]
name = "search"
harness = false
