name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      # --all follows path dependencies into the fork's entire workspace.
      - run: cargo fmt -p enable-loopback -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
