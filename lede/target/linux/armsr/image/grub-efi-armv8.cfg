@SERIAL_CONFIG@
@TERMINAL_CONFIG@

set default="0"
set timeout="@TIMEOUT@"

menuentry "@TITLE@ (Generic)" --id generic {
	search --set=root --label kernel
	linux /efi/openwrt/@KERNEL_NAME@ @GPT_ROOTPART@ @CMDLINE@ noinitrd
}
menuentry "@TITLE@ (Generic, failsafe)" --id generic-failsafe {
	search --set=root --label kernel
	linux /efi/openwrt/@KERNEL_NAME@ failsafe=true @GPT_ROOTPART@ @CMDLINE@ noinitrd
}
menuentry "@TITLE@ (Qualcomm Radxa Dragon Q6A)" --id q6a {
	search --set=root --label kernel
	linux /efi/openwrt/@KERNEL_NAME@ @GPT_ROOTPART@ @Q6A_CMDLINE@ noinitrd
	devicetree /efi/openwrt/q6a.dtb
}
menuentry "@TITLE@ (Qualcomm Radxa Dragon Q6A, failsafe)" --id q6a-failsafe {
	search --set=root --label kernel
	linux /efi/openwrt/@KERNEL_NAME@ failsafe=true @GPT_ROOTPART@ @Q6A_CMDLINE@ noinitrd
	devicetree /efi/openwrt/q6a.dtb
}
menuentry "@TITLE@ (Qualcomm Radxa Dragon Q8B)" --id q8b {
	search --set=root --label kernel
	linux /efi/openwrt/@KERNEL_NAME@ @GPT_ROOTPART@ @Q8B_CMDLINE@ noinitrd
	devicetree /efi/openwrt/q8b.dtb
}
menuentry "@TITLE@ (Qualcomm Radxa Dragon Q8B, failsafe)" --id q8b-failsafe {
	search --set=root --label kernel
	linux /efi/openwrt/@KERNEL_NAME@ failsafe=true @GPT_ROOTPART@ @Q8B_CMDLINE@ noinitrd
	devicetree /efi/openwrt/q8b.dtb
}
