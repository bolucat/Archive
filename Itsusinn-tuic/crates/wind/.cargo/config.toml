[build]
#rustc-wrapper = "sccache"
# Unlocks reqwest's experimental HTTP/3 client. `wind-tuic`'s `masquerade`
# feature pulls reqwest without `http3`, so this is currently inert within this
# workspace; it's kept in sync with the CI workflow, which passes it explicitly.
rustflags = ["--cfg", "reqwest_unstable"]

[env]
RUSTC_BOOTSTRAP = { value = "1" }
